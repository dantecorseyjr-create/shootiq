name: shootiq
description: Basketball shot analysis app with video recording and upload.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.8.0
  go_router: ^14.6.0
  camera: ^0.11.0+2
  image_picker: ^1.1.2
  path_provider: ^2.1.4
  path: ^1.9.0
  shared_preferences: ^2.5.5
  http: ^1.2.2
  video_player: ^2.9.2
  video_thumbnail: ^0.5.3
  camera_desktop: ^1.2.1
  fl_chart: ^1.2.0
  flutter_markdown: ^0.7.7+1
  package_info_plus: ^8.3.0
  in_app_review: ^2.0.10
  share_plus: ^10.1.4
  url_launcher: ^6.3.2
  intl: ^0.20.2
  file_selector: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/demo/
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  remove_alpha_ios: true
